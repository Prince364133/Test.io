<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: linear-gradient(135deg, skyblue, lightyellow);
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      animation: gradientAnimation 10s ease infinite;
    }
    @keyframes gradientAnimation {
      0% { background: linear-gradient(135deg, skyblue, lightyellow); }
      50% { background: linear-gradient(135deg, lightyellow, skyblue); }
      100% { background: linear-gradient(135deg, skyblue, lightyellow); }
    }
    h1 {
      text-align: center;
      color: blue;
      font-family: 'Cursive', cursive;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      transition: box-shadow 0.3s ease-in-out;
    }
    input:focus, select:focus {
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
      outline: none;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:active {
      background-color: #004494;
      box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
    }
    #summary {
      display: none;
      margin-top: 20px;
    }
    #summary h2 {
      color: #333;
    }
    #summary p {
      white-space: pre-wrap;
      font-family: monospace;
    }
    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }
    .popup button {
      margin-top: 10px;
      background-color: #28a745;
    }
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Assignment & Test</h1>
    <p id="formIntro">Please fill out the following details to create.</p>
    
 

     

      <label for="publisher">Publisher Name:</label>
      <input type="text" id="publisher" name="publisher" placeholder="e.g., NCERT, OSWAL" required>

      <label for="class">Class:</label>
     <select id="class" name="class" required>
        <option value="L.K.G">L.K.G</option>
        <option value="U.K.G">U.K.G</option>
         <option value=" 1 ">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
          <option value="4">4</option>
           <option value="5">5</option>
        <option value="6">6</option>
           <option value="7">7</option>
        <option vlaue="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
          <option value="11">11</option>
           <option value="12">12</option>
        <option value="Graduation">Graduation</option>
           <option value="competition">Competition</option>
    </select> 

      <label for="subject">Subject:</label>
      <input type="text" id="subject" name="subject" required>

      <label for="testLevel">words:</label>
      <select id="testLevel" name="testLevel" required>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <label for="chapter">Chapter number:</label>
      <input type="number" id="chapter" name="chapter" required placeholder="Required">

      <label for="chapterName">Chapter Name:</label>
      <input type="text" id="chapterName" name="chapterName" required placeholder="Required" >

      <label for="questions">total Questions:</label>
      <input type="number" id="questions" name="questions" required>
 
        <label for="mcq">MCQ:</label>
       <input type="number" id="mcq" name="mcq" required>
      
      <label for="t">truefalse:</label>
       <input type="number" id="t" name="t" required>
      
      <label for="f">fill in the blanks:</label>
       <input type="number" id="f" name="f" required>
        
         <label for="A">Assertion/region:</label>
       <input type="number" id="A" name="A" required>
      
         <label for="short">short Question:</label>
      <input type="number" id="short" name="short" required>
        
        <label for="long">long Questions:</label>
      <input type="number" id="long" name="long" required> 
        
        <label for="source">Question Source:</label>
       <select id="source" name="source" required>
        <option value="exercise">From Exercise</option>
        <option value="chapter">From Chapter</option>
          <option value="Book">Form whole book</option>
      </select>

      <label for="totalMarks">Total Marks:</label>
      <input type="number" id="totalMarks" name="totalMarks" required>

      <label for="passingMarks">Passing Marks:</label>
      <input type="number" id="passingMarks" name="passingMarks" required placeholder="Minimum marks to get pass" >

      <label for="difficulty">Difficulty Level:</label>
      <select id="difficulty" name="difficulty" required>
        <option value="easy">Easy</option>
        <option value="normal">Normal</option>
        <option value="hard">Hard</option>
      </select>
        
         <label for="language">language:</label>
      <select id="language" name="language" required>
        <option value="hindi">hindi</option>
        <option value="english">english</option>
        <option value="urdu">urdu</option>
          <option value="sanskrit">sanskrit</option>
      </select>

    <label for="Numerical">Type:</label>
      <select id="numerical" name="numerical" required>
        <option value="theory only">theory only</option>
        <option value="numericals and theory ">theory + numerical</option>
        <option value="numericals only">numerical only</option>
         </select>  
      
      <label for="specificCommand">Describe any specific things in Assignmetn/test:</label>
      <input type="text" id="specificCommand" name="specificCommand" placeholder="Optional commands">

      <button type="button" id="createTest">Create</button>
    </form>

    <div id="summary">
      <h2>Test Summary</h2>
      <p id="summaryText"></p>
      <button id="copySummary">Copy to Clipboard</button>
    </div>
  </div>

  <div class="popup-overlay" id="popupOverlay"></div>
  <div class="popup" id="popup">
    <h2>Test Created</h2>
    <p>Copy summary - Go back  -  generate PDF </p>
    <button id="popupClose">Close</button>
  </div>
<script>
document.getElementById('createTest').addEventListener('click', function() {
    // Gather form data
    const formData = {
        publisher: document.getElementById('publisher').value,
        class: document.getElementById('class').value,
        subject: document.getElementById('subject').value,
        testLevel: document.getElementById('testLevel').value,
        chapter: document.getElementById('chapter').value,
        chapterName: document.getElementById('chapterName').value,
        questions: document.getElementById('questions').value,
        mcq: document.getElementById('mcq').value,
        short: document.getElementById('short').value,
        long: document.getElementById('long').value,
        f: document.getElementById('f').value,
        t: document.getElementById('t').value,
        A: document.getElementById('A').value,
        source: document.getElementById('source').value,
        totalMarks: document.getElementById('totalMarks').value,
        passingMarks: document.getElementById('passingMarks').value,
        difficulty: document.getElementById('difficulty').value,
        language: document.getElementById('language').value,
        numerical: document.getElementById('numerical').value,
        specificCommand: document.getElementById('specificCommand').value
    };

    // Create summary text
   const summaryText = `Subject: ${formData.subject}
Class: ${formData.class}
Chapter Number: ${formData.chapter}
Chapter Name: ${formData.chapterName}
Language: ${formData.language}
Test Level: ${formData.testLevel}
Total Marks: ${formData.totalMarks}
Passing Marks: ${formData.passingMarks}
Difficulty Level: ${formData.difficulty}
Number of Questions: ${formData.questions}
MCQs: ${formData.mcq}
Assertion/Reason: ${formData.A}
Short Questions: ${formData.short}
Long Questions: ${formData.long}
Fill in the Blanks: ${formData.f}
True/False: ${formData.t}
Question Source: ${formData.source}
Publisher: ${formData.publisher}
Include Numerical Questions: ${formData.numerical}
Specific Command: ${formData.specificCommand}

Instructions:
You are a CBSE & NCERT teacher. Create a test/assignment using proper CBSE format. 
Do not include any introduction, explanation, or additional comments.
Only provide the test content directly, cleanly formatted.
Ensure all options are displayed in vertical format where applicable.
The content should be ready to copy, paste, and print without modifications.
The output must contain only the question paper without any comments, introductions,
or assistant-like phrases. Do not use any phrases like 'Here is your test' or 'As you requested'.
Note: Do not use tables or math equations written in LaTeX or special formatting. Format everything using plain text only.`;

    // Display summary
    document.getElementById('summaryText').innerText = summaryText;
    document.getElementById('summary').style.display = 'block';

    // Show popup
    document.getElementById('popup').style.display = 'block';
    document.getElementById('popupOverlay').style.display = 'block';

    // Copy to clipboard functionality and open new window
    navigator.clipboard.writeText(summaryText).then(() => {
        alert('Summary copied to clipboard!');
        // Open new window
        window.open('https://chatgpt.com/', '_blank');
    })
    .catch(err => {
        console.error('Failed to copy text: ', err);
    });

    // Close popup
    document.getElementById('popupClose').addEventListener('click', function() {
        document.getElementById('popup').style.display = 'none';
        document.getElementById('popupOverlay').style.display = 'none';
    });
});
</script>
</body>
</html>
